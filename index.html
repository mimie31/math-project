<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIAT: Agrotech & Food Security Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; padding: 20px; color: #1e293b; }
        .card { background: white; max-width: 900px; margin: 0 auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: #065f46; font-size: 1.8rem; margin-bottom: 5px; }
        .subtitle { color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }
        .math-section { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 25px; font-family: serif; }
        
        #insight-box { 
            margin-top: 25px; 
            padding: 25px; 
            border-radius: 15px; 
            background: #ffffff; 
            border: 1px solid #cbd5e1;
            display: none; 
            border-left: 8px solid #10b981;
            animation: fadeIn 0.4s ease;
        }

        .velocity-text { font-size: 1.5rem; font-weight: 800; color: #059669; margin-bottom: 5px; }
        .economic-text { font-size: 1.1rem; color: #6366f1; font-weight: 600; margin-bottom: 15px; }
        .insight-header { font-weight: 800; color: #f59e0b; text-transform: uppercase; letter-spacing: 1.2px; font-size: 0.85rem; display: block; margin-bottom: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Agro-Bio Intelligence Dashboard</h2>
    <div class="subtitle">Program: SFA/SFH/SFM • Analyzing Growth Velocity & Resource Efficiency</div>

    <div class="math-section">
        <strong>Biological Rate:</strong> $f'(x)$ (Weight Gain Velocity) <br>
        <strong>Food Security Metric:</strong> $C(x) = f'(x) \times FCR \times \text{Cost per kg}$
    </div>

    <canvas id="myChart"></canvas>

    <div id="insight-box">
        <div id="vel-output" class="velocity-text"></div>
        <div id="econ-output" class="economic-text"></div>
        
        <span class="insight-header">💡 AGROTECH INSIGHT & ACTION (LAYMAN'S TERMS)</span>
        <div id="layman-output">Loading...</div>
    </div>
</div>

<script>
    const L = 2500, k = 0.15, x0 = 25;
    const FEED_COST_KG = 2.80; // Realistic RM price for broiler feed in Malaysia
    const AVG_FCR = 1.6; // Feed Conversion Ratio

    const days = Array.from({length: 43}, (_, i) => i);
    const weights = days.map(x => (L / (1 + Math.exp(-k * (x - x0)))).toFixed(2));

    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: days,
            datasets: [{
                label: 'Biomass (Weight in Grams)',
                data: weights,
                borderColor: '#10b981',
                borderWidth: 3,
                pointRadius: 4,
                pointHoverRadius: 8,
                tension: 0.3,
                fill: true,
                backgroundColor: 'rgba(16, 185, 129, 0.05)'
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, title: { display: true, text: 'Grams (g)' } },
                x: { title: { display: true, text: 'Day of Growth Cycle' } }
            },
            onClick: (e, elements) => {
                if (elements.length > 0) {
                    const idx = elements[0].index;
                    const x = days[idx];
                    
                    // Derivative f'(x)
                    const expVal = Math.exp(-k * (x - x0));
                    const velocity = (L * k * expVal) / Math.pow(1 + expVal, 2);
                    
                    // Food Security Logic: Cost of growth at this specific moment
                    const dailyCost = (velocity / 1000) * AVG_FCR * FEED_COST_KG;
                    
                    document.getElementById('insight-box').style.display = 'block';
                    document.getElementById('vel-output').innerText = `Velocity f'(${x}): ${velocity.toFixed(2)} g/day`;
                    document.getElementById('econ-output').innerText = `Est. Cost of Gain: RM ${dailyCost.toFixed(3)} / bird / day`;
                    
                    let insight = "";
                    if(x < 15) {
                        insight = "Starter Phase: High Food Security risk if temperature isn't controlled. Small gains, but high metabolic investment. Don't waste premium feed here.";
                    } else if(x <= 30) {
                        insight = "Optimal Growth Window: The derivative is at its peak. This is the most 'profitable' growth. In Food Security terms, this is where nutrient-to-protein conversion is most efficient.";
                    } else {
                        insight = "Diminishing Returns: Growth velocity is slowing down. You are spending RM " + dailyCost.toFixed(2) + " daily for less and less weight gain. For better National Food Security, harvest now to free up coop space for the next batch.";
